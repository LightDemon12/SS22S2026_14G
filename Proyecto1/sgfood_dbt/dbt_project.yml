name: 'sgfood_dbt'
version: '1.0.0'
config-version: 2

# Perfil utilizado para la conexión
profile: 'sgfood_dbt'

# Rutas estándar del proyecto dbt
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Configuración de materializaciones por capas (Staging -> Intermediate -> Marts)
models:
  sgfood_dbt:
    # Capa Staging: Vistas de limpieza y estandarización básica sobre la capa raw
    staging:
      +materialized: view
      +schema: staging

    # Capa Intermediate: Vistas de transformación intermedia y cruces lógicos antes de marts
    intermediate:
      +materialized: view
      +schema: intermediate

    # Capa Marts: Tablas físicas optimizadas para consultas y reportería analítica (BI)
    marts:
      +materialized: table
      +schema: analytics
