sgfood_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres_dw') }}"
      user: "{{ env_var('POSTGRES_USER', 'admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'admin') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB', 'sgfood_db') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
